<body>
  <div id="root"></div>
  <div id="toast" class="toast hidden" role="status"></div>
  <script>
    const API = location.protocol === 'file:' ? 'http://localhost:8000' : '';
    const state = { user:null, page:'dashboard', mode:'company', jobs:[], companies:[], currentJob:null, changeFilter:'all' };
    const stages = ['Discovering relevant sources','Analyzing and selecting high-value sources','Extracting intelligence','Validating evidence','Building intelligence report','Dashboard ready'];
    const $ = (q, el=document) => el.querySelector(q);
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const initials = value => String(value||'?').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
    const fmtDate = value => value ? new Intl.DateTimeFormat(undefined,{dateStyle:'medium',timeStyle:'short'}).format(new Date(value)) : '—';
    const relative = value => { if(!value)return '—'; const ms=Date.now()-new Date(value); const h=Math.floor(ms/36e5); return h<1?'Just now':h<24?`${h}h ago`:h<168?`${Math.floor(h/24)}d ago`:fmtDate(value); };
    const safeUrl = value => /^https?:\/\//i.test(value||'') ? esc(value) : '#';

    async function api(path, options={}) {
      const res = await fetch(API+path,{credentials:'include',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});
      if(res.status===204)return null;
      const data = await res.json().catch(()=>({}));
      if(!res.ok){ if(res.status===401){state.user=null;renderAuth()} throw new Error(data.detail||'Something went wrong.'); }
      return data;
    }
    function toast(message){const el=$('#toast');el.textContent=message;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),3200)}
    function setTheme(value){localStorage.setItem('air-theme',value);const resolved=value==='system'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):value;document.documentElement.dataset.theme=resolved}
    setTheme(localStorage.getItem('air-theme')||'system');
    if(localStorage.getItem('air-sidebar')==='collapsed')document.documentElement.classList.add('sidebar-collapsed');
    matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if((localStorage.getItem('air-theme')||'system')==='system')setTheme('system')});

    async function boot(){
      try{state.user=await api('/api/auth/me'); await loadWorkspace(); route();}catch{renderAuth()}
      addEventListener('popstate',route);
    }
    function renderAuth(register=false){
      document.title='Sign in · Account Intelligence Radar';
      $('#root').innerHTML=`<div class="auth-shell">
        <section class="auth-panel"><div class="brand"><span class="brand-mark">AR</span><span>Account Intelligence Radar</span></div>
          <div class="auth-card"><div class="eyebrow">${register?'Create your workspace':'Welcome back'}</div>
            <h1>${register?'Start building account intelligence.':'Intelligence that compounds.'}</h1>
            <p class="lede">${register?'Create a private workspace for research, evidence, history, and change detection.':'Sign in to continue to your private intelligence workspace.'}</p>
            <form id="auth-form">${register?`<div class="field"><label for="name">Full name</label><input id="name" autocomplete="name" required minlength="2" placeholder="Your name"></div>`:''}
              <div class="field"><label for="email">Work email</label><input id="email" type="email" autocomplete="email" required placeholder="you@company.com"></div>
              <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="${register?'new-password':'current-password'}" required minlength="${register?10:1}" placeholder="${register?'At least 10 characters':'Your password'}"></div>
              <div id="auth-error"></div><button class="btn btn-primary btn-large btn-block">${register?'Create account':'Sign in'}</button>
            </form><p class="switch-auth">${register?'Already have an account?':'New to Radar?'} <button class="link-btn" id="switch-auth">${register?'Sign in':'Create an account'}</button></p>
          </div></section>
        <aside class="auth-story"><div class="story-content"><div class="eyebrow" style="color:#83d8b8">Persistent account intelligence</div><h2>Search once.<br>Learn continuously.</h2><p>Turn public evidence into a living view of every account—then see exactly what changed when you scan again.</p><div class="story-points"><div><strong>Evidence</strong><span>Every claim stays traceable</span></div><div><strong>History</strong><span>Every scan is preserved</span></div><div><strong>Change</strong><span>New, changed, and removed signals</span></div></div></div></aside>
      </div>`;
      $('#switch-auth').onclick=()=>renderAuth(!register);
      $('#auth-form').onsubmit=async e=>{e.preventDefault();const body={email:$('#email').value,password:$('#password').value,...(register?{name:$('#name').value}:{})};try{state.user=await api(`/api/auth/${register?'register':'login'}`,{method:'POST',body:JSON.stringify(body)});await loadWorkspace();navigate('/dashboard')}catch(err){$('#auth-error').innerHTML=`<div class="error-box">${esc(err.message)}</div>`}};
    }
    async function loadWorkspace(){const [jobs,companies]=await Promise.all([api('/api/jobs'),api('/api/companies')]);state.jobs=jobs.items;state.companies=companies.items}
    function shell(content,title='Dashboard'){
      const nav=[['dashboard','⌂','Dashboard','/dashboard'],['new-search','＋','New Search','/search'],['company','◎','Company Search','/search/company'],['geography','⌖','Geography Search','/search/geography'],['history','↺','Search History','/history'],['reports','▤','Saved Reports','/reports'],['settings','⚙','Settings','/settings']];
      $('#root').innerHTML=`<div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><span class="brand-mark">AR</span><span>Radar</span></div><nav class="nav"><div class="nav-section">Workspace</div>${nav.slice(0,5).map(n=>`<button class="nav-btn ${state.page===n[0]?'active':''}" data-path="${n[3]}"><span class="nav-icon">${n[1]}</span>${n[2]}</button>`).join('')}<div class="nav-section">Library</div>${nav.slice(5).map(n=>`<button class="nav-btn ${state.page===n[0]?'active':''}" data-path="${n[3]}"><span class="nav-icon">${n[1]}</span>${n[2]}</button>`).join('')}</nav><div class="profile-box"><div class="avatar">${initials(state.user.name)}</div><div class="profile-meta"><strong>${esc(state.user.name)}</strong><span>${esc(state.user.email)}</span></div><button class="icon-btn" id="logout" title="Log out">↪</button></div></aside>
        <div class="main-shell"><header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="icon-btn mobile-menu" id="menu">☰</button><button class="icon-btn desktop-collapse" id="collapse" title="Collapse sidebar">⇤</button><div class="breadcrumbs">Workspace / <strong>${esc(title)}</strong></div></div><div class="top-actions"><button class="icon-btn" id="theme-toggle" title="Change theme">◐</button><button class="btn btn-primary" data-path="/search/company">＋ New scan</button></div></header><main class="page">${content}</main></div></div>`;
      document.querySelectorAll('[data-path]').forEach(el=>el.onclick=()=>navigate(el.dataset.path));
      $('#menu')?.addEventListener('click',()=>$('#sidebar').classList.toggle('open'));
      $('#collapse')?.addEventListener('click',()=>{document.documentElement.classList.toggle('sidebar-collapsed');localStorage.setItem('air-sidebar',document.documentElement.classList.contains('sidebar-collapsed')?'collapsed':'expanded')});
      $('#theme-toggle').onclick=()=>{const current=localStorage.getItem('air-theme')||'system';setTheme(current==='system'?'light':current==='light'?'dark':'system');toast(`Theme: ${localStorage.getItem('air-theme')}`)};
      $('#logout').onclick=async()=>{await api('/api/auth/logout',{method:'POST'});state.user=null;renderAuth()};
    }
    function navigate(path){history.pushState({},'',path);route()}
    async function route(){
      if(!state.user)return renderAuth();
      const path=location.pathname;
      if(/^\/reports\/[^/]+$/.test(path))return renderReport(path.split('/')[2]);
      if(/^\/companies\/[^/]+$/.test(path))return renderCompany(path.split('/')[2]);
      if(path==='/search/company'){state.page='company';state.mode='company';return renderSearch()}
      if(path==='/search/geography'){state.page='geography';state.mode='geography';return renderSearch()}
      if(path==='/search'){state.page='new-search';return renderSearch()}
      if(path==='/history'){state.page='history';return renderHistory()}
      if(path==='/reports'){state.page='reports';return renderSaved()}
      if(path==='/settings'){state.page='settings';return renderSettings()}
      state.page='dashboard';renderDashboard();
    }
    function renderDashboard(){
      const complete=state.jobs.filter(x=>x.status==='completed'), sources=complete.reduce((a,b)=>a+b.source_count,0), repeated=state.jobs.filter(x=>x.has_comparison).length;
      const rows=state.jobs.slice(0,6).map(job=>activity(job)).join('');
      shell(`<div class="page-head"><div><div class="eyebrow">Intelligence workspace</div><h1>Good ${new Date().getHours()<12?'morning':new Date().getHours()<18?'afternoon':'evening'}, ${esc(state.user.name.split(' ')[0])}.</h1><p>Track your research activity and the signals changing across priority accounts.</p></div><button class="btn btn-primary btn-large" data-path="/search/company">Run intelligence scan →</button></div>
        <div class="grid grid-4"><div class="card metric"><div class="metric-top"><span>Total scans</span><span>◎</span></div><div class="metric-value">${state.jobs.length}</div><div class="metric-note">${complete.length} completed</div></div><div class="card metric"><div class="metric-top"><span>Company profiles</span><span>◫</span></div><div class="metric-value">${state.companies.length}</div><div class="metric-note">Persistent accounts</div></div><div class="card metric"><div class="metric-top"><span>Evidence sources</span><span>↗</span></div><div class="metric-value">${sources}</div><div class="metric-note">Across completed scans</div></div><div class="card metric"><div class="metric-top"><span>Repeat scans</span><span>∆</span></div><div class="metric-value">${repeated}</div><div class="metric-note">Compared over time</div></div></div>
        <div class="grid grid-3" style="margin-top:18px"><section class="card" style="grid-column:span 2"><div class="section-head"><h2>Recent intelligence</h2><a href="/history" data-path="/history">View history →</a></div><div class="activity">${rows||empty('No scans yet','Start with a company or geography search.')}</div></section><section class="card"><div class="section-head"><h2>Quick scan</h2></div><p class="lede">Research a priority account and preserve a baseline for future change detection.</p><div class="prompt-chips"><button class="chip" data-search="Saudi Aramco">Saudi Aramco</button><button class="chip" data-search="SABIC">SABIC</button><button class="chip" data-search="QatarEnergy">QatarEnergy</button></div><button class="btn btn-primary btn-block" style="margin-top:20px" data-path="/search/company">Open company search</button></section></div>`,'Dashboard');
      document.querySelectorAll('[data-search]').forEach(el=>el.onclick=()=>{sessionStorage.setItem('prefill-company',el.dataset.search);navigate('/search/company')});
    }
    function activity(job){return `<div class="activity-row"><div class="company-logo">${initials(job.query)}</div><div><div class="row-title">${esc(job.query)}</div><div class="row-sub">${job.mode==='company'?'Company intelligence':'Geography intelligence'} · ${relative(job.created_at)} · ${job.source_count} sources</div></div><span class="status ${job.status}">${job.status}</span></div>`}
    function renderSearch(){
      const prefill=sessionStorage.getItem('prefill-company')||'';sessionStorage.removeItem('prefill-company');
      const company=state.mode==='company';
      shell(`<div class="search-workspace"><div class="page-head"><div><div class="eyebrow">New intelligence scan</div><h1>What should Radar investigate?</h1><p>Choose a mode, define the objective, and let the evidence pipeline do the work.</p></div></div>
        <div class="mode-cards"><button class="mode-card ${company?'active':''}" data-mode="company"><span>◎</span><strong>Company intelligence</strong><small>Deep-dive one organization and preserve its history.</small></button><button class="mode-card ${!company?'active':''}" data-mode="geography"><span>⌖</span><strong>Geography intelligence</strong><small>Discover companies by market, sector, and criteria.</small></button></div>
        <form class="card search-card" id="scan-form">${company?`<h2>Research a company</h2><p class="lede">Build an evidence-backed view of an account and compare it with any previous scan.</p><div class="field"><label for="company-name">Company name</label><input class="hero-input" id="company-name" value="${esc(prefill)}" placeholder="Enter a company name…" required autofocus></div><div class="field"><label for="objective">Research objective</label><textarea id="objective">Extract headquarters, business units, core products, target industries, key executives, and recent strategic initiatives. Return structured JSON.</textarea></div><div class="prompt-chips"><button type="button" class="chip" data-prompt="Focus on executive leadership changes, reporting lines, and transformation ownership.">Leadership changes</button><button type="button" class="chip" data-prompt="Identify AI, ERP, data platform, digital transformation, and supply chain initiatives.">Transformation signals</button><button type="button" class="chip" data-prompt="Identify recent investments, partnerships, market expansion, and strategic priorities.">Growth initiatives</button></div>`:`<h2>Discover accounts in a market</h2><p class="lede">Describe the market and criteria. Radar will identify and analyze matching companies.</p><div class="form-grid"><div class="field"><label for="country">Country</label><input id="country" placeholder="Saudi Arabia" required></div><div class="field"><label for="city">City</label><input id="city" placeholder="Riyadh"></div><div class="field"><label for="sector">Sector / industry</label><input id="sector" placeholder="Manufacturing" required></div><div class="field"><label for="criteria">Target criteria</label><input id="criteria" placeholder="Investing in digital transformation" required></div><div class="field span-2"><label for="objective">Research objective</label><textarea id="objective">Identify top companies matching the criteria, then extract headquarters, business units, core products, target industries, key executives, and recent strategic initiatives.</textarea></div><div class="field"><label for="top-n">Companies to analyze</label><select id="top-n">${[1,3,5,8,10].map(n=>`<option ${n===3?'selected':''}>${n}</option>`).join('')}</select></div></div>`}
          <div id="scan-error"></div><div class="search-footer"><div class="privacy-note">Results are saved to your private history. Credentials and provider keys remain on the server.</div><button class="btn btn-primary btn-large">Run Intelligence Scan →</button></div></form>
        <section style="margin-top:22px"><div class="section-head"><h2>Recent searches</h2></div><div class="grid grid-3">${state.jobs.slice(0,3).map(j=>`<button class="card mode-card" data-recent="${esc(j.query)}"><strong>${esc(j.query)}</strong><small>${relative(j.created_at)} · ${j.source_count} sources</small></button>`).join('')||'<div class="lede">Your recent scans will appear here.</div>'}</div></section></div>`,company?'Company Search':'Geography Search');
      document.querySelectorAll('[data-mode]').forEach(el=>el.onclick=()=>{state.mode=el.dataset.mode;state.page=state.mode;renderSearch()});
      document.querySelectorAll('[data-prompt]').forEach(el=>el.onclick=()=>$('#objective').value=el.dataset.prompt);
      document.querySelectorAll('[data-recent]').forEach(el=>el.onclick=()=>{state.mode='company';sessionStorage.setItem('prefill-company',el.dataset.recent);renderSearch()});
      $('#scan-form').onsubmit=submitScan;
    }
    async function submitScan(e){
      e.preventDefault();let payload;
      if(state.mode==='company')payload={mode:'company',company:{company_name:$('#company-name').value.trim(),objective_prompt:$('#objective').value.trim()}};
      else {const location=[$('#city').value.trim(),$('#country').value.trim()].filter(Boolean).join(', ');payload={mode:'geography',geography:{location,target_criteria:`${$('#sector').value.trim()}; ${$('#criteria').value.trim()}`,objective_prompt:$('#objective').value.trim(),top_n:Number($('#top-n').value)}}}
      try{state.currentJob=await api('/api/jobs',{method:'POST',body:JSON.stringify(payload)});renderProcessing();pollScan(state.currentJob.job_id)}catch(err){$('#scan-error').innerHTML=`<div class="error-box">${esc(err.message)}</div>`}
    }
    function renderProcessing(){
      state.page='processing';const active=Math.max(0,stages.indexOf(state.currentJob?.stage));
      shell(`<div class="processing card"><div class="processing-mark">◎</div><div class="eyebrow">Intelligence scan in progress</div><h1 style="font-size:32px;letter-spacing:-.045em;margin:10px 0">${esc(state.currentJob?.query||'Researching your query')}</h1><p class="lede">Radar is evaluating public sources and assembling a traceable report. You can leave this page; the scan is saved to your history.</p><div class="indeterminate"></div><div class="process-list">${stages.slice(0,-1).map((s,i)=>`<div class="process-step ${i<active?'done':i===active?'current':''}"><span class="dot">${i<active?'✓':''}</span><span>${s}</span></div>`).join('')}</div><button class="btn btn-secondary" data-path="/history">View search history</button></div>`,'Processing');
    }
    function pollScan(id){
      const timer=setInterval(async()=>{try{const job=await api(`/api/jobs/${id}`);state.currentJob=job;if(job.status==='completed'){clearInterval(timer);await loadWorkspace();if(job.report_ids?.length)navigate(`/reports/${job.report_ids[0]}`);else navigate('/history')}else if(job.status==='failed'){clearInterval(timer);await loadWorkspace();shell(`<div class="card empty"><div class="empty-icon">!</div><h2>Scan could not be completed</h2><p>${esc(job.error)}</p><button class="btn btn-primary" data-path="/search/company">Try another scan</button></div>`,'Scan failed')}else renderProcessing()}catch{}},1800);
    }
    async function renderReport(id){
      state.page='report';shell('<div class="grid grid-4"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>','Report');
      try{
        const report=await api(`/api/reports/${id}`);
        const r=report.intelligence||{};
        const c=report.comparison&&Array.isArray(report.comparison.changes)?report.comparison:null;
        const sources=Array.isArray(report.sources)?report.sources:[];
        const searchResults=Array.isArray(report.search_results)?report.search_results:[];
        const meaningful=c?(Number(c.counts?.new||0)+Number(c.counts?.changed||0)+Number(c.counts?.removed||0)):0;
        const info=report.search_information||{};
        const metadata=[
          ['Search type',report.mode==='geography'?'Geography intelligence':'Company intelligence'],
          ['Search query',report.query],
          ['Objective',info.objective],
          ['Location',info.location],
          ['Target criteria',info.target_criteria],
          ['Search date',fmtDate(report.created_at)],
          ['Last updated',fmtDate(report.updated_at)],
          ['Report ID',report.id],
        ].filter(([,value])=>value);
        const extracted=sources.filter(x=>x.extraction_status==='extracted').length;
        const searchOnly=sources.filter(x=>x.extraction_status==='search_only').length;
        const failed=sources.filter(x=>x.extraction_status==='failed').length;
        const evidenceOnly=sources.filter(x=>x.extraction_status==='evidence').length;
        shell(`<div class="report-action-bar"><div class="report-ident"><strong>${esc(r.company_name||report.company_name||'Intelligence Report')}</strong><span>${esc(report.id)}</span></div><div class="report-actions"><button class="btn btn-secondary" data-path="/history">← History</button>${c?'<button class="btn btn-secondary" id="compare-action">∆ Compare</button>':''}<button class="btn btn-primary" id="pdf-download">↓ Download PDF</button><button class="btn btn-secondary" data-export="json">↓ JSON</button><button class="btn btn-secondary" data-export="markdown">↓ Markdown</button><button class="btn btn-secondary" id="copy-report-link">⧉ Copy link</button><button class="btn btn-secondary" data-rerun="${esc(report.job_id)}">↻ Re-run</button></div></div>
          <section class="card report-hero"><div class="report-title-row"><div class="report-logo">${initials(r.company_name||report.company_name)}</div><div><div class="eyebrow">${esc(report.mode==='geography'?'Geography intelligence report':'Company intelligence report')}</div><h1>${esc(r.company_name||report.company_name||'Intelligence Report')}</h1><div class="report-meta">${esc(r.headquarters||report.query||'Completed research')} · ${report.source_count||0} sources · ${report.findings_count||0} findings</div></div></div><div class="report-metadata">${metadata.map(([label,value])=>`<div class="meta-cell"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`).join('')}</div>${c?`<button class="change-banner" id="jump-changes"><div><strong>${meaningful} meaningful change${meaningful===1?'':'s'} detected since your last scan</strong><br><span>Compared with ${fmtDate(c.previous_scan_date)}</span></div><span>Review changes →</span></button>`:''}</section>
          <section class="card executive-summary" style="margin-top:18px"><div class="eyebrow">Executive Summary</div><h2 style="margin:8px 0">What the research found</h2><p>${esc(report.summary?.high_level||'The completed report contains the structured intelligence and evidence shown below.')}</p>${report.summary?.major_findings?.length?`<div class="summary-findings">${report.summary.major_findings.map(x=>`<div class="summary-finding">${esc(x)}</div>`).join('')}</div>`:''}</section>
          <div class="tabs" role="tablist" aria-label="Report sections"><button class="tab active" data-report-tab="overview" role="tab">Overview</button><button class="tab" data-report-tab="sources" role="tab">Sources · ${sources.length}</button><button class="tab" data-report-tab="search-results" role="tab">Search Results · ${searchResults.length}</button><button class="tab" data-report-tab="raw" role="tab">Raw Data</button></div>
          <div class="report-panel" data-report-panel="overview">${renderOverview(report,r,c)}</div>
          <div class="report-panel" data-report-panel="sources" hidden><div class="source-metrics"><div class="source-metric"><strong>${sources.length}</strong><span>Total sources</span></div><div class="source-metric"><strong>${extracted}</strong><span>Successfully extracted</span></div><div class="source-metric"><strong>${searchOnly}</strong><span>Search-only results</span></div><div class="source-metric"><strong>${evidenceOnly}</strong><span>Legacy evidence URLs</span></div><div class="source-metric"><strong>${failed}</strong><span>Extraction failed</span></div></div><div class="source-toolbar"><input id="source-search" placeholder="Search titles, domains, URLs…"><select id="source-domain"><option value="">All domains</option>${[...new Set(sources.map(x=>x.domain).filter(Boolean))].sort().map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select><select id="source-type"><option value="">All source types</option>${[...new Set(sources.map(x=>x.source_type).filter(Boolean))].sort().map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select><select id="source-sort"><option value="rank">Original relevance</option><option value="date">Newest publication date</option><option value="domain">Domain A-Z</option></select></div><div class="source-list" id="source-list"></div></div>
          <div class="report-panel" data-report-panel="search-results" hidden>${renderSearchResults(searchResults)}</div>
          <div class="report-panel raw-view" data-report-panel="raw" hidden><div class="section-head"><div><h2>Canonical report JSON</h2><div class="row-sub">The dashboard and every export derive from this stored report.</div></div><button class="btn btn-secondary" id="copy-raw-json">⧉ Copy JSON</button></div><pre class="raw-json">${esc(JSON.stringify(r,null,2))}</pre></div>
          <div id="source-drawer-root"></div>`,r.company_name||report.company_name||'Report');
        document.querySelectorAll('[data-export]').forEach(el=>el.onclick=()=>location.href=`${API}/api/reports/${id}/export/${el.dataset.export}`);
        $('#pdf-download').onclick=()=>downloadPdf(id,$('#pdf-download'));
        $('#copy-report-link').onclick=async()=>{await navigator.clipboard.writeText(location.href);toast('Report link copied')};
        $('#copy-raw-json').onclick=async()=>{await navigator.clipboard.writeText(JSON.stringify(r,null,2));toast('Report JSON copied')};
        $('[data-rerun]').onclick=async()=>{const job=await api(`/api/jobs/${report.job_id}/rerun`,{method:'POST'});state.currentJob=job;renderProcessing();pollScan(job.job_id)};
        $('#jump-changes')?.addEventListener('click',()=>{$('[data-report-tab="overview"]').click();$('#changes')?.scrollIntoView({behavior:'smooth'})});
        $('#compare-action')?.addEventListener('click',()=>$('#jump-changes')?.click());
        document.querySelectorAll('[data-report-tab]').forEach(tab=>tab.onclick=()=>{document.querySelectorAll('[data-report-tab]').forEach(x=>x.classList.toggle('active',x===tab));document.querySelectorAll('[data-report-panel]').forEach(panel=>panel.hidden=panel.dataset.reportPanel!==tab.dataset.reportTab)});
        if(c)bindChangeFilters(c);
        bindSourceControls(sources);
      }catch(err){shell(`<div class="card empty"><h2>Report unavailable</h2><p>${esc(err.message)}</p><button class="btn btn-secondary" data-path="/history">Back to history</button></div>`,'Report')}
    }
    function renderOverview(report,r,c){
      return `<div class="grid grid-4"><div class="card metric"><div class="metric-top"><span>Evidence sources</span><span>↗</span></div><div class="metric-value">${report.source_count||0}</div><div class="metric-note">Traceable URLs</div></div><div class="card metric"><div class="metric-top"><span>Structured findings</span><span>◫</span></div><div class="metric-value">${report.findings_count||0}</div><div class="metric-note">From canonical report data</div></div><div class="card metric"><div class="metric-top"><span>Leadership</span><span>♙</span></div><div class="metric-value">${r.leadership?.length||0}</div><div class="metric-note">Named executives</div></div><div class="card metric"><div class="metric-top"><span>Initiatives</span><span>∆</span></div><div class="metric-value">${r.strategic_initiatives?.length||0}</div><div class="metric-note">Strategic signals</div></div></div>
        ${c?changesSection(c):''}<div class="grid grid-2" style="margin-top:18px"><section class="card"><div class="section-head"><h2>Business snapshot</h2></div>${detailGroup('Business units',r.business_units)}${detailGroup('Products & services',r.products_and_services)}${detailGroup('Target industries',r.target_industries)}</section><section class="card"><div class="section-head"><h2>Leadership</h2></div><div class="detail-list">${r.leadership?.map(x=>`<div class="detail-item"><strong>${esc(x.name)}</strong>${esc(x.title)}${x.source_url?` · <a href="${safeUrl(x.source_url)}" target="_blank" rel="noopener noreferrer">Open source ↗</a>`:'<div class="row-sub">Source attribution was not provided by the research result.</div>'}</div>`).join('')||'<p class="lede">No publicly verifiable leadership data found.</p>'}</div></section></div>
        <section class="card" style="margin-top:18px"><div class="section-head"><h2>Strategic Intelligence</h2></div><div class="grid grid-3">${r.strategic_initiatives?.map(x=>`<div class="detail-item"><span class="status new">${esc(x.category||'Initiative')}</span><p style="margin:10px 0">${esc(x.description)}</p>${x.source_url?`<a href="${safeUrl(x.source_url)}" target="_blank" rel="noopener noreferrer">Supporting source ↗</a>`:'<div class="row-sub">No claim-level source was returned.</div>'}</div>`).join('')||'<p class="lede">No strategic initiatives found.</p>'}</div></section>
        <section class="card" style="margin-top:18px"><div class="section-head"><h2>Evidence</h2><span class="row-sub">${r.evidence_links?.length||0} evidence links</span></div><div class="detail-list">${r.evidence_links?.map((x,i)=>`<div class="detail-item"><strong>${esc(x.description||`Evidence source ${i+1}`)}</strong><a class="source-url" href="${safeUrl(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.url)}</a></div>`).join('')||'<p class="lede">No evidence links available.</p>'}</div></section>`;
    }
    function renderSearchResults(results){
      if(!results.length)return `<div class="card empty"><div class="empty-icon">⌕</div><strong>Raw search results were not retained</strong><p>Older reports preserve evidence URLs only. New scans retain titles, snippets, rank, and discovery queries.</p></div>`;
      return `<div class="section-head"><div><h2>Raw Search Results</h2><div class="row-sub">The original discovery results received before extraction.</div></div></div><div class="source-list">${results.map((x,i)=>`<article class="source-card"><div class="source-card-head"><div><div class="eyebrow">Result ${esc(x.rank||i+1)}</div><h3>${esc(x.title||x.domain||'Untitled result')}</h3></div><span class="status ${x.extraction_status==='extracted'?'completed':'unchanged'}">${esc((x.extraction_status||'search only').replace('_',' '))}</span></div><a class="source-url" href="${safeUrl(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.url)}</a>${x.snippet?`<p class="source-snippet">${esc(x.snippet)}</p>`:''}${x.search_query?`<div class="row-sub">Discovered by: ${esc(x.search_query)}</div>`:''}</article>`).join('')}</div>`;
    }
    function sourceCard(source,index){
      return `<button class="source-card" data-source-id="${esc(source.id)}"><div class="source-card-head"><div><div class="eyebrow">Source ${index+1}</div><h3>${esc(source.title||source.domain||'Untitled source')}</h3></div><span class="status ${source.extraction_status==='failed'?'failed':source.extraction_status==='extracted'?'completed':'unchanged'}">${esc((source.extraction_status||'evidence').replace('_',' '))}</span></div><span class="source-url">${esc(source.url)}</span>${source.snippet?`<p class="source-snippet">${esc(source.snippet)}</p>`:''}<div class="source-meta">${[source.domain,source.source_type,source.published_at,source.rank?`Rank ${source.rank}`:null].filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join('')}</div></button>`;
    }
    function bindSourceControls(sources){
      const draw=()=>{const query=($('#source-search')?.value||'').toLowerCase(),domain=$('#source-domain')?.value||'',type=$('#source-type')?.value||'',sort=$('#source-sort')?.value||'rank';let filtered=sources.filter(x=>!query||[x.title,x.domain,x.url,x.snippet].some(value=>String(value||'').toLowerCase().includes(query))).filter(x=>!domain||x.domain===domain).filter(x=>!type||x.source_type===type);filtered=[...filtered].sort((a,b)=>sort==='date'?String(b.published_at||'').localeCompare(String(a.published_at||'')):sort==='domain'?String(a.domain||'').localeCompare(String(b.domain||'')):(Number(a.rank||9999)-Number(b.rank||9999)));const list=$('#source-list');if(!list)return;list.innerHTML=filtered.map(sourceCard).join('')||'<div class="card empty">No sources match these filters.</div>';list.querySelectorAll('[data-source-id]').forEach(el=>el.onclick=()=>openSourceDrawer(sources.find(x=>x.id===el.dataset.sourceId)))};
      ['#source-search','#source-domain','#source-type','#source-sort'].forEach(selector=>$(selector)?.addEventListener(selector==='#source-search'?'input':'change',draw));draw();
    }
    function openSourceDrawer(source){
      if(!source)return;const fields=[['Publisher',source.publisher],['Domain',source.domain],['Source type',source.source_type],['Author',source.author],['Published',source.published_at],['Retrieved',source.retrieved_at],['Extraction status',source.extraction_status],['Relevance score',source.relevance_score],['Search rank',source.rank],['Search query',source.search_query]].filter(([,value])=>value!==null&&value!==undefined&&value!=='');
      $('#source-drawer-root').innerHTML=`<div class="drawer-backdrop" id="source-backdrop"><aside class="source-drawer" role="dialog" aria-modal="true" aria-labelledby="source-drawer-title"><div class="drawer-head"><div><div class="eyebrow">Source information</div><h2 id="source-drawer-title">${esc(source.title||source.domain||'Source details')}</h2></div><button class="icon-btn" id="close-source" aria-label="Close source details">×</button></div><a class="source-url open-source" href="${safeUrl(source.url)}" target="_blank" rel="noopener noreferrer">${esc(source.url)} ↗</a><div class="drawer-fields">${fields.map(([label,value])=>`<div class="drawer-field"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`).join('')}</div>${source.snippet?`<section class="drawer-section"><h3>Search-result snippet</h3><p class="lede">${esc(source.snippet)}</p></section>`:''}${source.extracted_text?`<section class="drawer-section"><h3>Extracted content</h3><details><summary>Show extracted content</summary><p class="lede">${esc(source.extracted_text)}</p></details></section>`:''}<section class="drawer-section"><h3>Evidence used</h3>${source.evidence?.length?source.evidence.map(x=>`<div class="detail-item">${esc(x)}</div>`).join(''):'<p class="lede">The research pipeline retained this source URL but did not return claim-level attribution for it.</p>'}</section><a class="btn btn-primary btn-block" href="${safeUrl(source.url)}" target="_blank" rel="noopener noreferrer">Open original source ↗</a></aside></div>`;
      const close=()=>$('#source-drawer-root').innerHTML='';$('#close-source').onclick=close;$('#source-backdrop').onclick=e=>{if(e.target.id==='source-backdrop')close()};addEventListener('keydown',function handler(e){if(e.key==='Escape'){close();removeEventListener('keydown',handler)}},{once:true});$('#close-source').focus();
    }
    async function downloadPdf(id,button){
      const original=button.textContent;button.disabled=true;button.textContent='Generating PDF…';
      try{const res=await fetch(`${API}/api/reports/${id}/export/pdf`,{credentials:'include'});if(!res.ok){const data=await res.json().catch(()=>({}));throw new Error(data.detail||"We couldn't generate the PDF report.")}const blob=await res.blob(),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;const disposition=res.headers.get('Content-Disposition')||'';link.download=disposition.match(/filename="([^"]+)"/)?.[1]||'account-intelligence-report.pdf';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('PDF report downloaded')}catch(err){toast(err.message||"We couldn't generate the PDF report. Please try again.")}finally{button.disabled=false;button.textContent=original}
    }
    function detailGroup(title,items){return `<div style="margin-bottom:20px"><div class="eyebrow" style="margin-bottom:9px">${title}</div><div class="tag-list">${items?.map(x=>`<span class="tag">${esc(x)}</span>`).join('')||'<span class="lede">Not found</span>'}</div></div>`}
    function changesSection(c){const counts=c?.counts||{};return `<section class="card" id="changes" style="margin-top:18px"><div class="section-head"><div><h2>Changes since last scan</h2><div class="row-sub">Meaningful normalized comparison—not raw text differences.</div></div></div><div class="change-filters">${['all','new','changed','removed','unchanged'].map(s=>`<button class="chip ${state.changeFilter===s?'active':''}" data-filter="${s}">${s==='all'?'All changes':s[0].toUpperCase()+s.slice(1)}${s==='all'?'':` · ${Number(counts[s]||0)}`}</button>`).join('')}</div><div id="change-list"></div></section>`}
    function bindChangeFilters(c){const changes=Array.isArray(c?.changes)?c.changes:[];const draw=()=>{const list=$('#change-list');if(!list)return;list.innerHTML=changes.filter(x=>state.changeFilter==='all'?x.status!=='unchanged':x.status===state.changeFilter).map(x=>`<div class="change-row"><span class="status ${x.status}">${x.status}</span><strong style="font-size:12px">${esc(x.label)}</strong><div class="change-copy">${x.before?`<del>Before: ${esc(x.before)}</del>`:''}${x.after?`<ins>${x.status==='changed'?'Now: ':''}${esc(x.after)}</ins>`:''}</div></div>`).join('')||'<div class="empty">No items in this category.</div>';document.querySelectorAll('[data-filter]').forEach(el=>el.classList.toggle('active',el.dataset.filter===state.changeFilter))};document.querySelectorAll('[data-filter]').forEach(el=>el.onclick=()=>{state.changeFilter=el.dataset.filter;draw()});draw()}
    function renderHistory(){
      const rows=state.jobs.map(j=>`<tr data-query="${esc(j.query.toLowerCase())}" data-mode="${j.mode}" data-date="${esc(j.created_at)}"><td><strong>${esc(j.query)}</strong><div class="row-sub">${j.mode==='company'?'Company Search':'Geography Search'}</div></td><td>${fmtDate(j.created_at)}</td><td><span class="status ${j.status}">${j.status}</span></td><td>${j.source_count}</td><td>${j.has_comparison?'Change comparison available':'Baseline scan'}</td><td><div class="table-actions">${j.status==='completed'?`<button class="btn btn-secondary" data-open-job="${j.id}">Open</button><button class="btn btn-quiet" data-rerun-job="${j.id}">Re-run</button>`:''}<button class="btn btn-danger" data-delete="${j.id}">Delete</button></div></td></tr>`).join('');
      shell(`<div class="page-head"><div><div class="eyebrow">Research library</div><h1>Search history</h1><p>Every scan is saved automatically and scoped to your account.</p></div><button class="btn btn-primary" data-path="/search/company">＋ New scan</button></div><div class="card" style="margin-bottom:15px"><div class="grid grid-3"><input id="history-search" placeholder="Search companies and markets…"><select id="history-mode"><option value="">All search types</option><option value="company">Company</option><option value="geography">Geography</option></select><select id="history-sort"><option value="newest">Newest first</option><option value="oldest">Oldest first</option></select></div></div><div class="table-wrap">${rows?`<table><thead><tr><th>Search</th><th>Date</th><th>Status</th><th>Sources</th><th>Comparison</th><th>Actions</th></tr></thead><tbody>${rows}</tbody></table>`:empty('No search history','Run your first intelligence scan to begin.')}</div>`,'Search History');
      $('#history-search').oninput=filterHistory;$('#history-mode').onchange=filterHistory;$('#history-sort').onchange=sortHistory;bindHistoryActions();
    }
    function filterHistory(){const q=$('#history-search').value.toLowerCase(),mode=$('#history-mode').value;document.querySelectorAll('tbody tr').forEach(row=>row.classList.toggle('hidden',!row.dataset.query.includes(q)||(mode&&row.dataset.mode!==mode)))}
    function sortHistory(){const body=$('tbody');if(!body)return;const direction=$('#history-sort').value==='newest'?-1:1;[...body.children].sort((a,b)=>direction*(new Date(a.dataset.date)-new Date(b.dataset.date))).forEach(row=>body.appendChild(row))}
    function bindHistoryActions(){
      document.querySelectorAll('[data-open-job]').forEach(el=>el.onclick=async()=>{const job=await api(`/api/jobs/${el.dataset.openJob}`);if(job.report_ids?.length)navigate(`/reports/${job.report_ids[0]}`)});
      document.querySelectorAll('[data-rerun-job]').forEach(el=>el.onclick=async()=>{const job=await api(`/api/jobs/${el.dataset.rerunJob}/rerun`,{method:'POST'});state.currentJob=job;renderProcessing();pollScan(job.job_id)});
      document.querySelectorAll('[data-delete]').forEach(el=>el.onclick=async()=>{if(!confirm('Delete this scan and its reports? This cannot be undone.'))return;await api(`/api/jobs/${el.dataset.delete}`,{method:'DELETE'});await loadWorkspace();renderHistory();toast('History item deleted')});
    }
    function renderSaved(){
      shell(`<div class="page-head"><div><div class="eyebrow">Company library</div><h1>Saved reports</h1><p>Persistent profiles consolidate each account’s current intelligence and scan timeline.</p></div></div><div class="grid grid-3">${state.companies.map(c=>`<button class="card mode-card" data-company="${esc(c.company_slug)}"><div class="company-logo">${initials(c.company_name)}</div><strong>${esc(c.company_name)}</strong><small>${c.scan_count} scan${c.scan_count===1?'':'s'} · ${c.source_count} sources · ${relative(c.last_scanned)}</small></button>`).join('')||empty('No saved reports','Completed company scans will appear here.')}</div>`,'Saved Reports');
      document.querySelectorAll('[data-company]').forEach(el=>el.onclick=()=>navigate(`/companies/${el.dataset.company}`));
    }
    async function renderCompany(slug){
      state.page='reports';shell('<div class="skeleton"></div>','Company Profile');
      try{const p=await api(`/api/companies/${slug}`),r=p.current_intelligence;shell(`<div class="page-head"><div class="report-title-row"><div class="report-logo">${initials(p.company_name)}</div><div><div class="eyebrow">Persistent company profile</div><h1>${esc(p.company_name)}</h1><p>${p.scans.length} historical scan${p.scans.length===1?'':'s'} · ${esc(r.headquarters||'Headquarters unavailable')}</p></div></div><button class="btn btn-primary" data-path="/reports/${p.current_report_id}">Open current intelligence →</button></div><div class="grid grid-2"><section class="card"><div class="section-head"><h2>Historical scans</h2></div><div class="detail-list">${p.scans.map(s=>`<button class="detail-item mode-card" data-path="/reports/${s.id}"><strong>${fmtDate(s.created_at)}</strong>${s.source_count} evidence sources</button>`).join('')}</div></section><section class="card"><div class="section-head"><h2>Changes over time</h2></div><div class="detail-list">${p.timeline.map(t=>{const n=t.counts.new+t.counts.changed+t.counts.removed;return `<div class="detail-item"><strong>${fmtDate(t.created_at)}</strong>${n} meaningful change${n===1?'':'s'} · ${t.counts.new} new · ${t.counts.changed} changed · ${t.counts.removed} removed</div>`}).join('')||'<p class="lede">Run this company again to establish a change timeline.</p>'}</div></section></div>`,'Company Profile')}catch(err){shell(`<div class="empty">${esc(err.message)}</div>`,'Company Profile')}
    }
    function renderSettings(){const theme=localStorage.getItem('air-theme')||'system';shell(`<div class="page-head"><div><div class="eyebrow">Preferences</div><h1>Settings</h1><p>Manage your reading experience and account session.</p></div></div><div class="grid grid-2"><section class="card"><div class="section-head"><h2>Appearance</h2></div><p class="lede">System follows the preference configured on this device.</p><div class="field"><label for="theme-select">Theme</label><select id="theme-select"><option value="system" ${theme==='system'?'selected':''}>System</option><option value="light" ${theme==='light'?'selected':''}>Light</option><option value="dark" ${theme==='dark'?'selected':''}>Dark</option></select></div></section><section class="card"><div class="section-head"><h2>Account</h2></div><div class="detail-item"><strong>${esc(state.user.name)}</strong>${esc(state.user.email)}</div><button class="btn btn-secondary" id="settings-logout" style="margin-top:16px">Log out</button></section></div>`,'Settings');$('#theme-select').onchange=e=>{setTheme(e.target.value);toast(`Theme: ${e.target.value}`)};$('#settings-logout').onclick=$('#logout').onclick}
    function empty(title,copy){return `<div class="empty"><div class="empty-icon">◎</div><strong>${esc(title)}</strong><p>${esc(copy)}</p></div>`}
    boot();
  </script>
</body>
</html>
