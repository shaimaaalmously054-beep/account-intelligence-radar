<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">Account Intelligence Radar - Current Architecture</title>
  <desc id="desc">Architecture diagram showing the authenticated SaaS workspace, FastAPI application, research pipeline, normalized intelligence data, SQLite persistence, comparison engine, interactive dashboard, sources, and PDF, JSON, and Markdown exports.</desc>

  <defs>
    <linearGradient id="headerGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f765d"/>
      <stop offset="1" stop-color="#173f34"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#050907" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1.5 8.5 5 1 8.5" fill="none" stroke="#6ebd9f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1.5 8.5 5 1 8.5" fill="none" stroke="#6f8178" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .bg { fill:#0f1713; }
      .band { fill:#141e19; stroke:#293a32; stroke-width:1; }
      .band-label { fill:#7f9389; font:700 11px Inter,Segoe UI,sans-serif; letter-spacing:1.6px; }
      .card { fill:#1a2620; stroke:#34483e; stroke-width:1; }
      .card-green { fill:#15372c; stroke:#3d9c78; stroke-width:1; }
      .card-blue { fill:#172d3b; stroke:#4f8cad; stroke-width:1; }
      .card-amber { fill:#362b19; stroke:#ad8140; stroke-width:1; }
      .card-purple { fill:#29243d; stroke:#7468a8; stroke-width:1; }
      .title { fill:#eef6f1; font:700 24px Inter,Segoe UI,sans-serif; }
      .subtitle { fill:#9bafa5; font:400 12px Inter,Segoe UI,sans-serif; }
      .card-title { fill:#edf5f0; font:700 13px Inter,Segoe UI,sans-serif; }
      .card-copy { fill:#a9bbb2; font:400 10.5px Inter,Segoe UI,sans-serif; }
      .tiny { fill:#74887e; font:500 9.5px Inter,Segoe UI,sans-serif; }
      .badge { fill:#21342b; stroke:#3b594b; stroke-width:1; }
      .badge-text { fill:#87c9ac; font:700 9px Inter,Segoe UI,sans-serif; letter-spacing:.5px; }
      .flow { fill:none; stroke:#6ebd9f; stroke-width:1.5; marker-end:url(#arrow); }
      .flow-muted { fill:none; stroke:#6f8178; stroke-width:1.25; marker-end:url(#arrowMuted); }
      .flow-dashed { fill:none; stroke:#8b7956; stroke-width:1.2; stroke-dasharray:5 4; marker-end:url(#arrowMuted); }
      .divider { stroke:#293a32; stroke-width:1; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="860"/>

  <!-- Header -->
  <rect x="28" y="24" width="1144" height="70" rx="16" fill="url(#headerGlow)" filter="url(#shadow)"/>
  <circle cx="67" cy="59" r="18" fill="#6fd4ad"/>
  <text x="67" y="63" text-anchor="middle" fill="#10261e" font-family="Inter,Segoe UI,sans-serif" font-size="11" font-weight="800">AR</text>
  <text class="title" x="98" y="54">Account Intelligence Radar</text>
  <text class="subtitle" x="98" y="74">Persistent, evidence-backed account intelligence workspace</text>
  <rect class="badge" x="870" y="43" width="128" height="30" rx="15"/>
  <text class="badge-text" x="934" y="62" text-anchor="middle">CURRENT STATE</text>
  <rect class="badge" x="1010" y="43" width="134" height="30" rx="15"/>
  <text class="badge-text" x="1077" y="62" text-anchor="middle">JULY 2026</text>

  <!-- Experience and identity -->
  <rect class="band" x="28" y="112" width="1144" height="130" rx="16"/>
  <text class="band-label" x="48" y="136">01 · EXPERIENCE &amp; IDENTITY</text>

  <g filter="url(#shadow)">
    <rect class="card-green" x="52" y="153" width="208" height="66" rx="11"/>
    <text class="card-title" x="70" y="178">Authenticated workspace</text>
    <text class="card-copy" x="70" y="197">Registration · login · secure sessions</text>
    <text class="tiny" x="70" y="212">PBKDF2 passwords · per-user ownership</text>

    <rect class="card" x="282" y="153" width="200" height="66" rx="11"/>
    <text class="card-title" x="300" y="178">Company search</text>
    <text class="card-copy" x="300" y="197">Company name + research objective</text>
    <text class="tiny" x="300" y="212">Repeat scans establish comparisons</text>

    <rect class="card" x="504" y="153" width="200" height="66" rx="11"/>
    <text class="card-title" x="522" y="178">Geography search</text>
    <text class="card-copy" x="522" y="197">Location + sector + target criteria</text>
    <text class="tiny" x="522" y="212">Discovers and analyzes target accounts</text>

    <rect class="card" x="726" y="153" width="200" height="66" rx="11"/>
    <text class="card-title" x="744" y="178">History &amp; profiles</text>
    <text class="card-copy" x="744" y="197">Saved scans · timelines · reruns</text>
    <text class="tiny" x="744" y="212">Persistent company intelligence</text>

    <rect class="card-blue" x="948" y="153" width="200" height="66" rx="11"/>
    <text class="card-title" x="966" y="178">Responsive SPA</text>
    <text class="card-copy" x="966" y="197">Light · dark · system themes</text>
    <text class="tiny" x="966" y="212">Desktop · tablet · mobile</text>
  </g>

  <!-- Application and research pipeline -->
  <rect class="band" x="28" y="260" width="1144" height="242" rx="16"/>
  <text class="band-label" x="48" y="284">02 · FASTAPI APPLICATION &amp; RESEARCH PIPELINE</text>

  <g filter="url(#shadow)">
    <rect class="card-purple" x="52" y="308" width="178" height="86" rx="12"/>
    <text class="card-title" x="70" y="333">Protected API</text>
    <text class="card-copy" x="70" y="353">Auth · jobs · reports</text>
    <text class="card-copy" x="70" y="369">companies · comparisons</text>
    <text class="tiny" x="70" y="385">FastAPI + ownership checks</text>

    <rect class="card-green" x="276" y="308" width="170" height="86" rx="12"/>
    <text class="card-title" x="294" y="333">1 · SerpAPI</text>
    <text class="card-copy" x="294" y="353">Public-source discovery</text>
    <text class="card-copy" x="294" y="369">Title · URL · snippet · rank</text>
    <text class="tiny" x="294" y="385">Raw search results retained</text>

    <rect class="card-amber" x="492" y="308" width="170" height="86" rx="12"/>
    <text class="card-title" x="510" y="333">2 · URL decision</text>
    <text class="card-copy" x="510" y="353">DeepSeek → OpenAI</text>
    <text class="card-copy" x="510" y="369">Relevance scoring &amp; selection</text>
    <text class="tiny" x="510" y="385">Deterministic fallback</text>

    <rect class="card-blue" x="708" y="308" width="170" height="86" rx="12"/>
    <text class="card-title" x="726" y="333">3 · Firecrawl</text>
    <text class="card-copy" x="726" y="353">Structured page extraction</text>
    <text class="card-copy" x="726" y="369">Leadership · initiatives</text>
    <text class="tiny" x="726" y="385">Bounded async polling</text>

    <rect class="card-green" x="924" y="308" width="224" height="86" rx="12"/>
    <text class="card-title" x="942" y="333">4 · Normalize &amp; validate</text>
    <text class="card-copy" x="942" y="353">Typed company intelligence</text>
    <text class="card-copy" x="942" y="369">Safe URLs · deduped sources</text>
    <text class="tiny" x="942" y="385">Pydantic report model</text>
  </g>

  <path class="flow" d="M230 351 H274"/>
  <path class="flow" d="M446 351 H490"/>
  <path class="flow" d="M662 351 H706"/>
  <path class="flow" d="M878 351 H922"/>

  <rect class="card" x="250" y="424" width="700" height="52" rx="10"/>
  <text class="card-title" x="270" y="446">Real scan lifecycle</text>
  <text class="card-copy" x="270" y="464">Discover sources → select high-value pages → extract intelligence → validate evidence → build report → open dashboard</text>
  <path class="flow-muted" d="M141 394 V450 H248"/>
  <path class="flow-muted" d="M1036 394 V450 H952"/>
  <path class="flow-dashed" d="M577 394 V422"/>
  <text class="tiny" x="589" y="415">provider fallback</text>

  <!-- Canonical data and persistence -->
  <rect class="band" x="28" y="520" width="1144" height="145" rx="16"/>
  <text class="band-label" x="48" y="544">03 · CANONICAL DATA &amp; PERSISTENCE</text>

  <g filter="url(#shadow)">
    <rect class="card-purple" x="52" y="566" width="212" height="72" rx="11"/>
    <text class="card-title" x="70" y="591">SQLite persistence</text>
    <text class="card-copy" x="70" y="610">Users · sessions · jobs</text>
    <text class="tiny" x="70" y="626">Reports · comparisons · ownership</text>

    <rect class="card-green" x="312" y="558" width="270" height="88" rx="12"/>
    <text class="card-title" x="330" y="584">Canonical intelligence JSON</text>
    <text class="card-copy" x="330" y="604">Company profile · findings · evidence</text>
    <text class="card-copy" x="330" y="620">Leadership · strategic initiatives</text>
    <text class="tiny" x="330" y="636">Single source for dashboard and exports</text>

    <rect class="card-blue" x="630" y="566" width="238" height="72" rx="11"/>
    <text class="card-title" x="648" y="591">Source records</text>
    <text class="card-copy" x="648" y="610">URL · domain · snippet · query</text>
    <text class="tiny" x="648" y="626">Rank · type · extraction status</text>

    <rect class="card" x="916" y="566" width="232" height="72" rx="11"/>
    <text class="card-title" x="934" y="591">Legacy report files</text>
    <text class="card-copy" x="934" y="610">JSON + Markdown preserved</text>
    <text class="tiny" x="934" y="626">Backward-compatible evidence URLs</text>
  </g>

  <path class="flow" d="M1036 394 V505 H447 V556"/>
  <path class="flow-muted" d="M312 602 H266"/>
  <path class="flow-muted" d="M582 602 H628"/>
  <path class="flow-muted" d="M868 602 H914"/>

  <!-- Presentation and outputs -->
  <rect class="band" x="28" y="683" width="1144" height="149" rx="16"/>
  <text class="band-label" x="48" y="707">04 · PRESENTATION, COMPARISON &amp; EXPORTS</text>

  <g filter="url(#shadow)">
    <rect class="card-green" x="52" y="730" width="248" height="76" rx="11"/>
    <text class="card-title" x="70" y="755">Interactive report dashboard</text>
    <text class="card-copy" x="70" y="774">Overview · findings · evidence</text>
    <text class="tiny" x="70" y="791">Sources · search results · raw data</text>

    <rect class="card-amber" x="328" y="730" width="238" height="76" rx="11"/>
    <text class="card-title" x="346" y="755">Comparison engine</text>
    <text class="card-copy" x="346" y="774">NEW · CHANGED · REMOVED</text>
    <text class="tiny" x="346" y="791">Normalized, field-aware change detection</text>

    <rect class="card-blue" x="594" y="730" width="258" height="76" rx="11"/>
    <text class="card-title" x="612" y="755">Professional PDF</text>
    <text class="card-copy" x="612" y="774">ReportLab · multi-page layout</text>
    <text class="tiny" x="612" y="791">Clickable URLs · bibliography · page numbers</text>

    <rect class="card-purple" x="880" y="730" width="268" height="76" rx="11"/>
    <text class="card-title" x="898" y="755">Portable canonical exports</text>
    <text class="card-copy" x="898" y="774">JSON download · Markdown download</text>
    <text class="tiny" x="898" y="791">Same report ID and stored intelligence</text>
  </g>

  <path class="flow" d="M447 646 V676 H176 V728"/>
  <path class="flow-muted" d="M447 646 V728"/>
  <path class="flow-muted" d="M447 676 H723 V728"/>
  <path class="flow-muted" d="M723 676 H1014 V728"/>

  <!-- Footer -->
  <line class="divider" x1="52" y1="842" x2="1148" y2="842"/>
  <text class="tiny" x="52" y="854">Security boundary: HttpOnly sessions · server-side secrets · user-scoped records · escaped external content · HTTP(S)-only source links</text>
  <text class="tiny" x="1148" y="854" text-anchor="end">FastAPI · SQLite · SerpAPI · DeepSeek/OpenAI · Firecrawl · ReportLab</text>
</svg>
